version: "3.8"

# SmartRAG local infrastructure
# Ollama is intentionally NOT containerized here — see README for why.
# Everything below runs 100% locally with no cloud account and no API key.

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: smartrag-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smartrag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
